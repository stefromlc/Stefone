<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO and Meta Tags -->
    <meta name="description" content="A beautiful, PS4-styled digital archive interface for browsing and downloading validated PlayStation 4 FPKG backups.">
    <meta name="keywords" content="PS4, Digital Archive, FPKG, PKG, Download, PlayStation 4, Backups, Homebrew, Library">
    <meta name="author" content="Digital Archive Library">
    <title>PS4 Digital Archive Library</title>
    
    <!-- Code-Based SVG Favicon (PS4 Controller minimalist icon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23003791'/><path d='M25 50h20M35 40v20M55 50a5 5 0 1 0 10 0 5 5 0 1 0-10 0M70 40a5 5 0 1 0 10 0 5 5 0 1 0-10 0' stroke='%23FFF' stroke-width='6' stroke-linecap='round'/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=SST:wght@300;400;500;700&display=swap');

        /* Authentic PS4 UI Base Configuration */
        body {
            background-color: #003791;
            color: #ffffff;
            font-family: 'SST', 'Open Sans', system-ui, -apple-system, sans-serif;
            overflow: hidden; 
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Hide Scrollbars */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* PS4 Dynamic Flow Background */
        .ps4-bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #004cba 0%, #001a4d 100%);
            animation: pulseBg 15s infinite alternate;
        }

        @keyframes pulseBg {
            0% { background: radial-gradient(circle at 50% 50%, #004cba 0%, #001a4d 100%); }
            100% { background: radial-gradient(circle at 50% 60%, #005ce6 0%, #001133 100%); }
        }

        .ps4-ribbon {
            position: absolute;
            width: 200vw; height: 100vh;
            top: 0; left: -50vw;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.02) 30%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.02) 70%, rgba(255,255,255,0) 100%);
            transform-origin: center;
            animation: flowRibbon 20s infinite linear;
        }

        .ps4-ribbon:nth-child(2) {
            background: linear-gradient(to right, rgba(0, 162, 255, 0) 0%, rgba(0, 162, 255, 0.08) 50%, rgba(0, 162, 255, 0) 100%);
            animation-direction: reverse;
            animation-duration: 25s;
            transform: rotate(15deg);
        }

        @keyframes flowRibbon {
            0% { transform: translateX(0) scaleY(1) rotate(-5deg); }
            25% { transform: translateX(-5vw) scaleY(1.2) rotate(-3deg); }
            50% { transform: translateX(-10vw) scaleY(1) rotate(-5deg); }
            75% { transform: translateX(-5vw) scaleY(0.8) rotate(-7deg); }
            100% { transform: translateX(0) scaleY(1) rotate(-5deg); }
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slidePanelRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-in { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-panel { animation: slidePanelRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* PS4 Tile Interactions */
        .ps4-tile {
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            cursor: pointer;
            border: 3px solid transparent;
            box-sizing: border-box;
            background-color: rgba(0,0,0,0.3);
        }
        
        .ps4-tile:hover, .ps4-tile:focus-visible, .ps4-tile.active {
            transform: scale(1.08);
            border: 3px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 50;
            outline: none;
        }

        /* Sidebar Navigation Item */
        .ps4-nav-item {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .ps4-nav-item:hover, .ps4-nav-item:focus-visible {
            background-color: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.5);
            outline: none;
        }
        .ps4-nav-item.selected {
            background-color: #ffffff;
            color: #000000;
            font-weight: 600;
        }

        /* Custom Inputs for Filters */
        .ps4-input, .ps4-select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.2s;
            border-radius: 2px;
        }
        .ps4-input:focus, .ps4-select:focus {
            border-color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            outline: none;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .ps4-select option {
            background: #001a4d;
            color: white;
        }

        /* Fallback Art */
        .card-image-fallback {
            background: linear-gradient(135deg, #1a2a6c, #11998e, #2b5876);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .custom-scrollbar {
            overflow-y: auto;
        }
        .custom-scrollbar::-webkit-scrollbar { display: block; width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        
        .broken-strip {
            background: repeating-linear-gradient( 45deg, rgba(0,0,0,0.8), rgba(0,0,0,0.8) 10px, rgba(220,38,38,0.9) 10px, rgba(220,38,38,0.9) 20px );
        }
        
        /* Dashboard Horizontal Scroll */
        .dashboard-row {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div class="ps4-bg-container">
        <div class="ps4-ribbon"></div>
        <div class="ps4-ribbon"></div>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const Icons = {
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>,
            Back: () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 8 8 12 12 16"/><line x1="16" y1="12" x2="8" y2="12"/></svg>,
            Library: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>,
            Queue: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            YouTube: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#ef4444"><path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"/></svg>,
            Heart: ({ filled }) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill={filled ? "#ef4444" : "none"} stroke={filled ? "#ef4444" : "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>,
            Dashboard: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>,
            Play: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Pause: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        };

        const formatBytes = (bytes, decimals = 2) => {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        };

        const checkImage = (url) => new Promise((resolve) => {
            if (!url) return resolve(null);
            const img = new Image();
            img.onload = () => resolve(url);
            img.onerror = () => resolve(null);
            img.src = url;
        });

        // Safe Downloader
        const triggerSafeDownload = (url) => {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            setTimeout(() => document.body.removeChild(iframe), 30000); 
        };

        const PS4_CASE_OVERLAY_URL = "https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/de2a1530-fff4-46d6-b489-286221c74fc4/dl3ksbk-f50b6c1f-8780-4cb4-b08d-3c2df2545a4e.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi9kZTJhMTUzMC1mZmY0LTQ2ZDYtYjQ4OS0yODYyMjFjNzRmYzQvZGwza3Niay1mNTBiNmMxZi04NzgwLTRjYjQtYjA4ZC0zYzJkZjI1NDVhNGUucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0._j1Gk0Ev3tNXQvhwdelJY6oh-jQkimcYwhkSQtrR5ME";

        // Caching Helpers
        const getCache = (key, defaultVal) => { try { return JSON.parse(localStorage.getItem(key)) || defaultVal; } catch(e) { return defaultVal; } };
        const saveCache = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} };
        
        const artworkCache = getCache('ps4_art_cache', {});
        const saveArtworkCache = (id, url) => { if(url){ artworkCache[id] = url; saveCache('ps4_art_cache', artworkCache); }};
        const metaCache = getCache('ps4_meta_cache', {});
        const saveMetaCache = (id, data) => { metaCache[id] = data; saveCache('ps4_meta_cache', metaCache); };

        const GameDetailsModal = ({ game, coverSrc, onClose, queue, addToQueue, markAsDownloaded, isFav, toggleFav }) => {
            const [meta, setMeta] = useState({ desc: null, bg: null, loading: true });
            
            const isQueued = queue.some(q => q.id === game.id);
            const [downloadingDirect, setDownloadingDirect] = useState(false);

            useEffect(() => {
                if (metaCache[game.id]) {
                    setMeta({ ...metaCache[game.id], loading: false });
                    return;
                }
                let isMounted = true;
                const fetchNoKeyMetadata = async () => {
                    const fetchedMeta = { desc: null, bg: null };
                    const safeTitleForWiki = game.cleanTitle.replace(/[^a-zA-Z0-9 ]/g, ' ').trim();
                    const shortTitleForSteam = game.cleanTitle.split(' ').slice(0, 4).join(' ');

                    try {
                        const csRes = await fetch(`https://www.cheapshark.com/api/1.0/games?title=${encodeURIComponent(shortTitleForSteam)}&limit=1`);
                        const csData = await csRes.json();
                        if (csData?.length > 0) {
                            const steamMatch = csData[0].thumb.match(/apps\/(\d+)\//);
                            if (steamMatch) {
                                const heroUrl = `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${steamMatch[1]}/library_hero.jpg`;
                                await checkImage(heroUrl).then(res => { if(res) fetchedMeta.bg = heroUrl; });
                            }
                        }
                    } catch (e) {}
                    try {
                        const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&generator=search&gsrsearch=${encodeURIComponent(safeTitleForWiki + ' video game')}&gsrlimit=1&format=json&origin=*`;
                        const wRes = await fetch(wikiUrl);
                        const wData = await wRes.json();
                        if (wData?.query?.pages) {
                            fetchedMeta.desc = wData.query.pages[Object.keys(wData.query.pages)[0]].extract;
                        }
                    } catch (e) {}

                    if (isMounted) {
                        setMeta({ ...fetchedMeta, loading: false });
                        saveMetaCache(game.id, fetchedMeta);
                    }
                };
                fetchNoKeyMetadata();
                const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handleEsc);
                return () => { isMounted = false; window.removeEventListener('keydown', handleEsc); };
            }, [game]);

            const bgImage = meta.bg || coverSrc || game.imageUrl;

            return (
                <div className="fixed inset-0 z-[100] flex animate-fade-in bg-black/80 backdrop-blur-xl custom-scrollbar">
                    {bgImage && (
                        <div className="absolute inset-0 opacity-20 pointer-events-none">
                            <img src={bgImage} alt="bg" className="w-full h-full object-cover blur-sm scale-105" />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#001433] via-transparent to-transparent"></div>
                            <div className="absolute inset-0 bg-gradient-to-r from-[#001433] via-[#001433]/90 to-transparent"></div>
                        </div>
                    )}

                    <div className="relative z-10 w-full h-full flex flex-col p-8 md:p-16 text-white overflow-y-auto custom-scrollbar">
                        <div className="flex items-center gap-4 mb-10">
                            <button 
                                onClick={onClose}
                                className="flex items-center gap-2 text-white hover:bg-white/20 px-4 py-2 rounded-full transition-all focus:outline-none focus:ring-2 focus:ring-white border border-transparent hover:border-white/50"
                            >
                                <Icons.Back />
                                <span className="font-semibold text-lg tracking-wide">Back to Library</span>
                            </button>
                        </div>

                        <div className="flex flex-col md:flex-row gap-12 max-w-7xl mx-auto w-full">
                            <div className="flex flex-col gap-6 w-full md:w-[350px] flex-shrink-0">
                                <div className="w-full aspect-[3/4] bg-black/40 shadow-[0_20px_50px_rgba(0,0,0,0.8)] border-2 border-white/20 relative overflow-hidden">
                                    {coverSrc ? <img src={coverSrc} alt={game.title} className="w-full h-full object-cover" /> : 
                                        <div className="w-full h-full card-image-fallback flex items-center justify-center p-6 pt-14 text-center">
                                            <span className="font-bold text-2xl drop-shadow-md">{game.title}</span>
                                        </div>
                                    }
                                    <img src={PS4_CASE_OVERLAY_URL} className="absolute top-0 left-0 w-full h-full pointer-events-none z-10" style={{ objectFit: 'fill' }} alt="" />
                                </div>
                                
                                <div className="flex flex-col gap-3 w-full">
                                    <button 
                                        onClick={() => toggleFav(game.id)}
                                        className={`w-full py-3 px-6 text-md font-bold rounded-sm flex items-center justify-center gap-3 transition-colors focus:outline-none border
                                            ${isFav ? 'bg-red-900/40 border-red-500 text-red-400 hover:bg-red-900/60' : 'bg-black/40 border-white/20 text-white hover:bg-white/10'}`}
                                    >
                                        <Icons.Heart filled={isFav} /> {isFav ? 'Remove from Favourites' : 'Add to Favourites'}
                                    </button>

                                    <button 
                                        onClick={() => { if (!isQueued) addToQueue(game, coverSrc); }}
                                        disabled={isQueued}
                                        className={`w-full py-4 px-6 text-lg font-bold rounded-sm flex items-center justify-center gap-3 transition-transform focus:outline-none shadow-[0_0_20px_rgba(255,255,255,0.2)] 
                                            ${!isQueued ? 'bg-white text-black hover:scale-105' : 'bg-green-700 text-white cursor-default'}
                                        `}
                                    >
                                        {!isQueued ? <><Icons.Queue /> Add to Queue</> : <><Icons.CheckCircle /> In Queue</>}
                                    </button>
                                    
                                    <button 
                                        onClick={() => {
                                            setDownloadingDirect(true);
                                            triggerSafeDownload(game.downloadUrl);
                                            markAsDownloaded(game.id);
                                            setTimeout(() => setDownloadingDirect(false), 3000);
                                        }}
                                        disabled={downloadingDirect}
                                        className={`w-full border py-4 px-6 text-lg font-bold rounded-sm flex items-center justify-center gap-3 transition-all focus:outline-none shadow-[0_0_15px_rgba(37,99,235,0.4)]
                                            ${downloadingDirect ? 'bg-blue-800 border-blue-700 text-white cursor-default' : 'bg-blue-600 border-blue-500 text-white hover:bg-blue-500 hover:scale-105 focus:scale-105'}
                                        `}
                                    >
                                        {downloadingDirect ? <><div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Starting...</> : <><Icons.Download /> Direct Download</>}
                                    </button>
                                    
                                    <a 
                                        href={`https://www.youtube.com/results?search_query=${encodeURIComponent(game.cleanTitle + ' PS4 trailer')}`}
                                        target="_blank"
                                        rel="noopener noreferrer"

        const QueueManager = ({ isOpen, onClose, queue, setQueue, markAsDownloaded }) => {

                    setDownloadingIds(prev => ({...prev, [item.id]: false}));

            const handleDownloadAll = () => {
                queue.forEach((item, index) => {

            return (
                <>
                    <div className="fixed inset-0 z-[150] bg-black/60 backdrop-blur-sm animate-fade-in" onClick={onClose}></div>

        const SettingsModal = ({ isOpen, onClose, settings, setSettings, clearCache }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm animate-fade-in custom-scrollbar">
                     <div className="bg-[#001433] border border-white/20 p-8 rounded-lg max-w-md w-full shadow-2xl relative">
                         <h2 className="text-2xl font-light mb-6 flex items-center gap-3 border-b border-white/20 pb-4">
                             <Icons.Settings/> Preferences
                         </h2>
                         
                         <div className="flex flex-col gap-5 mb-8">
                             <label className="flex items-center gap-3 cursor-pointer p-2 hover:bg-white/5 rounded transition-colors">
                                 <input type="checkbox" checked={settings.hideDownloaded} onChange={e => setSettings({...settings, hideDownloaded: e.target.checked})} className="w-5 h-5 accent-blue-600 rounded" />
                                 <span className="text-white/90">Hide already downloaded games</span>

                             <label className="flex items-center gap-3 cursor-pointer p-2 hover:bg-white/5 rounded transition-colors">
                                 <input type="checkbox" checked={settings.showBrokenLinks} onChange={e => setSettings({...settings, showBrokenLinks: e.target.checked})} className="w-5 h-5 accent-blue-600 rounded" />

                         <div className="flex flex-col gap-3 pt-4 border-t border-white/20">

                                 Close Settings
                             </button>
                         </div>
                     </div>
                </div>
            )
        };

        const GameCard = React.memo(({ game, onClick, isFav, toggleFav }) => {
            const cardRef = useRef();
            const [isVisible, setIsVisible] = useState(false);
            const [imgState, setImgState] = useState('pending');
            const [currentSrc, setCurrentSrc] = useState(null);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setIsVisible(true); observer.disconnect(); }
                }, { threshold: 0.1, rootMargin: '300px' });
                if (cardRef.current) observer.observe(cardRef.current);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                if (!isVisible || imgState === 'loaded') return;
                let isMounted = true;
                const fetchArtwork = async () => {
                    setImgState('loading');
                    if (game.imageUrl) { if (isMounted) { setCurrentSrc(game.imageUrl); setImgState('loaded'); } return; }
                    if (artworkCache[game.id]) { if (isMounted) { setCurrentSrc(artworkCache[game.id]); setImgState('loaded'); } return; }

                    const safeTitle = game.cleanTitle.replace(/[^a-zA-Z0-9 ]/g, ' ').trim();
                    const shortTitle = game.cleanTitle.split(' ').slice(0, 4).join(' ');

                    try {
                        const wikiCatUrl = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=intitle:"${encodeURIComponent(safeTitle)}" incategory:"PlayStation 4 game covers"&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&format=json&origin=*`;
                        const resCat = await fetch(wikiCatUrl);
                        const dataCat = await resCat.json();
                        if (dataCat?.query?.pages) {
                            const url = dataCat.query.pages[Object.keys(dataCat.query.pages)[0]]?.imageinfo?.[0]?.url;
                            if (url && isMounted) { saveArtworkCache(game.id, url); setCurrentSrc(url); setImgState('loaded'); return; }
                        }
                    } catch (e) {}

                    try {
                        const libretroTitle = game.cleanTitle.replace(/[&*/:`<>?\\|]/g, '_');
                        const libretroUrl = `https://raw.githubusercontent.com/libretro-thumbnails/libretro-thumbnails/master/Sony%20-%20PlayStation%204/Named_Boxarts/${encodeURIComponent(libretroTitle)}.png`;
                        const libretroImg = await checkImage(libretroUrl);
                        if (libretroImg && isMounted) { saveArtworkCache(game.id, libretroImg); setCurrentSrc(libretroImg); setImgState('loaded'); return; }
                    } catch (e) {}

                    try {
                        const csRes = await fetch(`https://www.cheapshark.com/api/1.0/games?title=${encodeURIComponent(shortTitle)}&limit=1`);
                        const csData = await csRes.json();
                        if (csData?.[0]?.thumb) {
                            const steamAppMatch = csData[0].thumb.match(/apps\/(\d+)\//);
                            if (steamAppMatch) {
                                const finalUrl = await checkImage(`https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${steamAppMatch[1]}/library_600x900.jpg`);
                                if (finalUrl && isMounted) { saveArtworkCache(game.id, finalUrl); setCurrentSrc(finalUrl); setImgState('loaded'); return; }
                            }
                        }
                    } catch (e) {}
                    if (isMounted) setImgState('error');
                };
                fetchArtwork();
                return () => { isMounted = false; };
            }, [isVisible, game]);

            return (
                <div className="flex flex-col gap-2 relative group w-[180px] sm:w-auto">
                    <div 
                        ref={cardRef}
                        className="ps4-tile w-full aspect-[3/4] relative overflow-hidden flex-shrink-0"
                        tabIndex="0"
                    >
                        {/* Interactive Area */}
                        <div className="absolute inset-0 z-20" onClick={() => onClick(game, currentSrc)}></div>
                        
                        {/* Favourite Toggle (Requires higher z-index) */}
                        <button 
                            onClick={(e) => { e.stopPropagation(); toggleFav(game.id); }}
                            className="absolute top-2 left-2 z-30 p-1.5 rounded-full bg-black/40 border border-white/20 hover:bg-black/60 transition-colors drop-shadow-lg"
                            title={isFav ? "Remove Favourite" : "Add Favourite"}
                        >
                            <Icons.Heart filled={isFav} />
                        </button>

                        {imgState === 'loaded' && currentSrc ? (
                            <img src={currentSrc} alt={game.title} className="w-full h-full object-cover animate-fade-in" loading="lazy" />
                        ) : (
                            <div className="w-full h-full card-image-fallback flex flex-col items-center justify-center p-4 pt-10 text-center">
                                {imgState === 'error' ? <span className="font-bold text-white/90 text-sm shadow-sm">{game.title}</span> : <div className="w-6 h-6 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>}
                            </div>
                        )}
                        
                        <img src={PS4_CASE_OVERLAY_URL} className="absolute top-0 left-0 w-full h-full pointer-events-none z-10" style={{ objectFit: 'fill' }} alt="" />

                        <div className="absolute top-8 right-2 flex flex-col gap-1 items-end z-10 pointer-events-none">
                            {game.isBroken && <span className="text-white text-[10px] font-bold px-1.5 py-0.5 rounded-sm shadow-md mb-1 broken-strip border border-red-500/50">BROKEN LINK</span>}
                            {game.region !== 'Other' && <span className="bg-red-700 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-sm shadow-md">{game.region}</span>}
                            {game.type !== 'Base Game' && <span className="bg-[#0040a8] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-sm shadow-md">{game.type}</span>}
                        </div>

                        <div className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/90 to-transparent px-2 py-1 pt-4 z-10 pointer-events-none">
                            <p className="text-[11px] text-white/80 font-mono text-right">{formatBytes(game.size)}</p>
                        </div>
                    </div>
                    <div className="w-full px-1 opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity duration-200 text-center">
                        <p className="text-white text-xs font-semibold truncate drop-shadow-md">{game.title}</p>
                    </div>
                </div>
            );
        });

        function useInfiniteScroll(callback, hasMore) {
            const observer = useRef(null);
            const observerTarget = useCallback((node) => {
                // Disconnect the previous observer to prevent duplicates
                if (observer.current) observer.current.disconnect();
                
                // If there are no more items or the node doesn't exist, stop here
                if (!node || !hasMore) return;
                
                // Create a fresh observer attached to the new node
                observer.current = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) {
                        callback();
                    }
                }, { root: null, rootMargin: '250px', threshold: 0.1 });
                
                observer.current.observe(node);
            }, [callback, hasMore]);
            
            return observerTarget;
        }

        const Clock = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            return <div className="text-white font-medium text-lg tracking-wide">{time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>;
        };

        const App = () => {
            const [games, setGames] = useState([]);
            const [fetchStatus, setFetchStatus] = useState({ active: true, currentLetter: 'Loading Local Data...' });
            const [selectedGame, setSelectedGame] = useState(null);
            const [currentView, setCurrentView] = useState('store'); // 'store' or 'dashboard'
            
            const [isQueueOpen, setIsQueueOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            
            // Persisted States
            const [settings, setSettings] = useState(() => getCache('ps4_settings', { hideDownloaded: false, showBrokenLinks: false }));
            const [downloadHistory, setDownloadHistory] = useState(() => getCache('ps4_downloaded_games', []));
            const [queue, setQueue] = useState(() => getCache('ps4_download_queue', []));
            const [favourites, setFavourites] = useState(() => getCache('ps4_favourites', []));
            const [recentlyViewed, setRecentlyViewed] = useState(() => getCache('ps4_recent', []));
            
            useEffect(() => saveCache('ps4_settings', settings), [settings]);
            useEffect(() => saveCache('ps4_download_queue', queue), [queue]);
            useEffect(() => saveCache('ps4_favourites', favourites), [favourites]);
            useEffect(() => saveCache('ps4_recent', recentlyViewed), [recentlyViewed]);

            // Handlers
            const handleGameClick = (g, src) => {
                setSelectedGame({ game: g, coverSrc: src });
                setRecentlyViewed(prev => [g.id, ...prev.filter(id => id !== g.id)].slice(0, 20));
            };

            const toggleFav = useCallback((id) => {
                setFavourites(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
            }, []);

            const handleAddToQueue = (game, coverSrc) => {
                setQueue(prev => prev.find(q => q.id === game.id) ? prev : [...prev, { id: game.id, game, coverSrc }]);
            };

            const markAsDownloaded = useCallback((id) => {
                setDownloadHistory(prev => {
                    if (prev.includes(id)) return prev;
                    const updated = [id, ...prev];
                    saveCache('ps4_downloaded_games', updated);
                    return updated;
                });
            }, []);

            const clearAllCache = () => {
                localStorage.clear();
                window.location.reload(); 
            };

            // Filters & Sorts
            const [activeCategory, setActiveCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [regionFilter, setRegionFilter] = useState('All');
            const [dlStatusFilter, setDlStatusFilter] = useState('All');
            const [sortOption, setSortOption] = useState('A-Z');
            const [minSizeGB, setMinSizeGB] = useState('');
            const [maxSizeGB, setMaxSizeGB] = useState('');
            const [displayLimit, setDisplayLimit] = useState(48);

            useEffect(() => {
                let isMounted = true;
                const fetchLocalData = async () => {
                    try {
                        const formatGame = (game, isBroken) => {
                            const extMatch = game.original_filename.match(/\.([a-z0-9]+)$/i);
                            return {
                                id: game.original_filename,
                                title: game.clean_title,
                                cleanTitle: game.clean_title,
                                originalFilename: game.original_filename,
                                collection: game.collection,
                                size: Math.floor((game.size_gb || 0) * 1024 * 1024 * 1024), 
                                sizeGB: game.size_gb,
                                format: extMatch ? extMatch[1].toUpperCase() : 'PKG',
                                cusa: game.cusa,
                                region: game.region,
                                type: game.type,
                                downloadUrl: game.download_link,
                                sourceUrl: `https://archive.org/details/${game.collection}`,
                                imageUrl: null,
                                isBroken
                            };
                        };

                        const [workRes, errRes] = await Promise.all([
                            fetch('./working_games.json').catch(() => null),
                            fetch('./error_games.json').catch(() => null)
                        ]);

                        let allGames = [];
                        if (workRes?.ok) allGames = allGames.concat((await workRes.json()).map(g => formatGame(g, false)));
                        if (errRes?.ok) allGames = allGames.concat((await errRes.json()).map(g => formatGame(g, true)));
                        
                        if (isMounted) {
                            setGames(allGames);
                            setFetchStatus({ active: false, currentLetter: allGames.length === 0 ? 'No JSON data found.' : '' });
                        }
                    } catch (e) {
                        if (isMounted) setFetchStatus({ active: false, currentLetter: 'Error loading data' });
                    }
                };
                fetchLocalData();
                return () => { isMounted = false; };
            }, []);

            const processedGames = useMemo(() => {
                let result = [...games];

                // Global Settings Hide
                if (!settings.showBrokenLinks) result = result.filter(g => !g.isBroken);
                if (settings.hideDownloaded) result = result.filter(g => !downloadHistory.includes(g.id));

                // Advanced Broad Search
                if (searchQuery) {
                    const q = searchQuery.toLowerCase().trim();
                    result = result.filter(g => 
                        g.title.toLowerCase().includes(q) || 
                        (g.cusa && g.cusa.toLowerCase().includes(q)) ||
                        (g.originalFilename && g.originalFilename.toLowerCase().includes(q)) ||
                        g.region.toLowerCase().includes(q) ||
                        g.type.toLowerCase().includes(q) ||
                        (g.collection && g.collection.toLowerCase().includes(q))
                    );
                }
                
                // Categories
                if (activeCategory === 'Favourites') result = result.filter(g => favourites.includes(g.id));
                else if (activeCategory !== 'All') {
                    const typeMap = { 'Games': 'Base Game', 'Updates': 'Update', 'Add-Ons': 'DLC' };
                    result = result.filter(g => g.type === typeMap[activeCategory]);
                }
                
                // Quick Filters
                if (regionFilter !== 'All') result = result.filter(g => g.region === regionFilter);
                if (dlStatusFilter === 'Downloaded') result = result.filter(g => downloadHistory.includes(g.id));
                if (dlStatusFilter === 'Not Downloaded') result = result.filter(g => !downloadHistory.includes(g.id));

                if (minSizeGB !== '') {
                    const min = parseFloat(minSizeGB);
                    if (!isNaN(min)) result = result.filter(g => g.sizeGB >= min);
                }
                if (maxSizeGB !== '') {
                    const max = parseFloat(maxSizeGB);
                    if (!isNaN(max)) result = result.filter(g => g.sizeGB <= max);
                }

                // Smart Sorting
                result.sort((a, b) => {
                    switch(sortOption) {
                        case 'Z-A': return b.title.localeCompare(a.title);
                        case 'Size (Small-Large)': return a.size - b.size;
                        case 'Size (Large-Small)': return b.size - a.size;
                        case 'Downloaded First': 
                            const aDl = downloadHistory.includes(a.id);
                            const bDl = downloadHistory.includes(b.id);
                            if (aDl === bDl) return a.title.localeCompare(b.title);
                            return aDl ? -1 : 1;
                        case 'Not Downloaded First':
                            const aNd = !downloadHistory.includes(a.id);
                            const bNd = !downloadHistory.includes(b.id);
                            if (aNd === bNd) return a.title.localeCompare(b.title);
                            return aNd ? -1 : 1;
                        case 'A-Z':
                        default: return a.title.localeCompare(b.title);
                    }
                });
                return result;
            }, [games, searchQuery, activeCategory, regionFilter, dlStatusFilter, sortOption, minSizeGB, maxSizeGB, settings, downloadHistory, favourites]);

            // Reset pagination on filter change
            useEffect(() => { setDisplayLimit(48); }, [searchQuery, activeCategory, regionFilter, dlStatusFilter, sortOption, minSizeGB, maxSizeGB]);

            const displayedGames = useMemo(() => processedGames.slice(0, displayLimit), [processedGames, displayLimit]);
            const hasMore = displayLimit < processedGames.length;
            const loadMore = useCallback(() => setDisplayLimit(prev => prev + 48), []);
            const loaderRef = useInfiniteScroll(loadMore, hasMore);

            return (
                <div className="h-screen flex flex-col relative text-white">
                    
                    <SettingsModal 
                        isOpen={isSettingsOpen} 
                        onClose={() => setIsSettingsOpen(false)}
                        settings={settings}
                        setSettings={setSettings}
                        clearCache={clearAllCache}
                    />

                    {selectedGame && (
                        <GameDetailsModal 
                            game={selectedGame.game} 
                            coverSrc={selectedGame.coverSrc}
                            onClose={() => setSelectedGame(null)} 
                            queue={queue}
                            addToQueue={handleAddToQueue}
                            markAsDownloaded={markAsDownloaded}
                            isFav={favourites.includes(selectedGame.game.id)}
                            toggleFav={toggleFav}
                        />
                    )}

                    <QueueManager 
                        isOpen={isQueueOpen} 
                        onClose={() => setIsQueueOpen(false)} 
                        queue={queue}
                        setQueue={setQueue}
                        markAsDownloaded={markAsDownloaded}
                    />

                    {/* PS4 Library Top Bar */}
                    <header className="w-full flex-shrink-0 pt-6 pb-4 px-10 flex justify-between items-start z-10 bg-gradient-to-b from-black/50 to-transparent">
                        <div className="flex items-center gap-4 text-3xl font-light tracking-wide mt-2">
                            <Icons.Library /> 
                            <span>Library</span>
                        </div>

                        <div className="flex items-center gap-6 mt-2">
                            {fetchStatus.active && (
                                <div className="text-sm text-white/80 flex items-center gap-2 bg-black/20 px-3 py-1 rounded-full border border-white/10">
                                    <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                                    {fetchStatus.currentLetter}
                                </div>
                            )}
                            
                            <button 
                                onClick={() => setCurrentView('dashboard')}
                                className={`flex items-center gap-2 px-4 py-1.5 rounded-full border transition-colors focus:outline-none ${currentView === 'dashboard' ? 'bg-white text-black border-white' : 'bg-white/10 text-white border-white/20 hover:bg-white/20'}`}
                            >
                                <Icons.Dashboard /> <span className="font-semibold text-sm">Dashboard</span>
                            </button>
                            
                            <button 
                                onClick={() => setCurrentView('store')}
                                className={`flex items-center gap-2 px-4 py-1.5 rounded-full border transition-colors focus:outline-none ${currentView === 'store' ? 'bg-white text-black border-white' : 'bg-white/10 text-white border-white/20 hover:bg-white/20'}`}
                            >
                                <Icons.Search /> <span className="font-semibold text-sm">Store</span>
                            </button>

                            <button 
                                onClick={() => setIsQueueOpen(true)}
                                className="flex items-center gap-2 bg-white/10 hover:bg-white/20 transition-colors px-4 py-1.5 rounded-full border border-white/20 focus:outline-none"
                            >
                                <Icons.Queue />
                                <span className="font-semibold text-sm">Queue ({queue.length})</span>
                            </button>

                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className="flex items-center gap-2 bg-white/10 hover:bg-white/20 transition-colors p-2 rounded-full border border-white/20 focus:outline-none"
                                title="Preferences"
                            >
                                <Icons.Settings />
                            </button>

                            <div className="flex items-center gap-2 bg-black/20 px-3 py-1 rounded-full border border-white/10">
                                <div className="w-6 h-6 rounded bg-blue-600 flex items-center justify-center shadow-sm"><Icons.User /></div>
                                <span className="font-semibold text-sm px-1">Player 1</span>
                            </div>
                            <Clock />
                        </div>
                    </header>

                    {/* Conditional Rendering between Dashboard and Store */}
                    {currentView === 'dashboard' ? (
                        <Dashboard 
                            games={games} 
                            downloadHistory={downloadHistory} 
                            favourites={favourites} 
                            recentlyViewed={recentlyViewed}
                            onGameClick={handleGameClick}
                            toggleFav={toggleFav}
                        />
                    ) : (
                        <div className="flex-grow flex overflow-hidden w-full relative z-10 mt-4 animate-fade-in">
                            <aside className="w-72 flex-shrink-0 flex flex-col gap-6 px-8 pb-8 overflow-y-auto custom-scrollbar">
                                <nav className="flex flex-col">
                                    {['All', 'Favourites', 'Games', 'Updates', 'Add-Ons'].map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => setActiveCategory(cat)}
                                            className={`ps4-nav-item flex items-center justify-between text-left py-3 px-4 text-xl rounded cursor-pointer ${activeCategory === cat ? 'selected' : 'text-white/70'}`}
                                        >
                                            {cat}
                                            {cat === 'Favourites' && <Icons.Heart filled={activeCategory === 'Favourites'} />}
                                        </button>
                                    ))}
                                </nav>

                                <div className="w-full h-px bg-white/20 my-2"></div>

                                <div className="flex flex-col gap-5">
                                    <div className="text-sm font-semibold tracking-widest uppercase text-white/50 px-2">Refine Search</div>
                                    
                                    <div className="relative">
                                        <Icons.Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-white/50" />
                                        <input 
                                            type="text" 
                                            placeholder="Title, CUSA, File..."
                                            className="ps4-input pl-10 pr-4 py-2 w-full text-sm rounded-full"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                        />
                                    </div>

                                    <div className="flex flex-col gap-2">
                                        <label className="text-white/70 text-sm font-semibold px-2">Sort By</label>
                                        <select 
                                            className="ps4-select w-full px-3 py-2 text-sm rounded"
                                            value={sortOption}
                                            onChange={e => setSortOption(e.target.value)}
                                        >
                                            <option>A-Z</option>
                                            <option>Z-A</option>
                                            <option>Size (Small-Large)</option>
                                            <option>Size (Large-Small)</option>
                                            <option>Downloaded First</option>
                                            <option>Not Downloaded First</option>
                                        </select>
                                    </div>

                                    <div className="flex flex-col gap-2">
                                        <label className="text-white/70 text-sm font-semibold px-2">Status</label>
                                        <div className="flex gap-2 bg-black/30 p-1 rounded">
                                            {['All', 'Downloaded', 'Not Downloaded'].map(stat => (
                                                <button 
                                                    key={stat} onClick={() => setDlStatusFilter(stat)}
                                                    className={`flex-1 py-1.5 text-xs text-center rounded transition-colors ${dlStatusFilter === stat ? 'bg-white text-black font-bold' : 'text-white hover:bg-white/10'}`}
                                                >
                                                    {stat === 'Not Downloaded' ? 'New' : stat}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-2">
                                        <label className="text-white/70 text-sm font-semibold px-2">Region Tag</label>
                                        <div className="flex gap-2 bg-black/30 p-1 rounded">
                                            {['All', 'US', 'EU'].map(reg => (
                                                <button 
                                                    key={reg} onClick={() => setRegionFilter(reg)}
                                                    className={`flex-1 py-1.5 text-sm rounded transition-colors ${regionFilter === reg ? 'bg-white text-black font-bold' : 'text-white hover:bg-white/10'}`}
                                                >
                                                    {reg}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="mt-4 px-2">
                                        <p className="text-white/40 text-xs font-mono">Found {processedGames.length} items</p>
                                    </div>
                                </div>
                            </aside>

                            <main className="flex-grow px-8 pb-16 overflow-y-auto custom-scrollbar">
                                {displayedGames.length === 0 && !fetchStatus.active ? (
                                    <div className="w-full h-full flex flex-col items-center justify-center text-white/30">
                                        <Icons.Search />
                                        <h2 className="text-xl mt-4">No content matches your filters</h2>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7 gap-x-4 gap-y-8 pr-6">
                                        {displayedGames.map((game, idx) => (
                                            <div key={`${game.id}-${idx}`} className="animate-slide-in" style={{ animationDelay: `${(idx % 24) * 0.02}s` }}>
                                                <GameCard 
                                                    game={game} 
                                                    onClick={handleGameClick}
                                                    isFav={favourites.includes(game.id)}
                                                    toggleFav={toggleFav}
                                                />
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div ref={loaderRef} className="w-full py-12 flex justify-center text-white/40">
                                    {hasMore ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : displayedGames.length > 0 && <span className="text-xs font-bold tracking-widest uppercase opacity-30">End of List</span>}
                                </div>
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
