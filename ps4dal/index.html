        const CoverFlowGallery = ({ games, onGameClick, favourites, toggleFav }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const containerRef = useRef(null);
            const touchStartX = useRef(0);

            // Filter for games with artwork or prioritized titles
            const flowGames = useMemo(() => games.slice(0, 300), [games]);

            const next = useCallback(() => setCurrentIndex(i => Math.min(i + 1, flowGames.length - 1)), [flowGames.length]);
            const prev = useCallback(() => setCurrentIndex(i => Math.max(i - 1, 0)), []);

            // Keyboard/Gamepad D-Pad Listener
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight') next();
                    if (e.key === 'ArrowLeft') prev();
                    if (e.key === 'Enter' && flowGames[currentIndex]) {
                        onGameClick(flowGames[currentIndex], artworkCache[flowGames[currentIndex].id] || flowGames[currentIndex].imageUrl);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [next, prev, currentIndex, flowGames, onGameClick]);

            // Touch support for Mobile
            const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
            const handleTouchEnd = (e) => {
                const diff = touchStartX.current - e.changedTouches[0].clientX;
                if (diff > 45) next();
                if (diff < -45) prev();
            };

            const activeGame = flowGames[currentIndex];

            if (!flowGames.length) {
                return <div className="flex-grow flex items-center justify-center text-white/40">No games available for Cover Flow.</div>;
            }

            return (
                <div 
                    ref={containerRef}
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                    className="flex-grow flex flex-col justify-between items-center relative overflow-hidden select-none pb-8"
                >
                    {/* Background Ambience */}
                    {activeGame && (
                        <div className="absolute inset-0 pointer-events-none opacity-20 transition-all duration-700">
                            <img 
                                src={artworkCache[activeGame.id] || activeGame.imageUrl || ''} 
                                alt="" 
                                className="w-full h-full object-cover blur-2xl scale-125"
                            />
                        </div>
                    )}

                    {/* Nav Controls */}
                    <button 
                        onClick={prev}
                        disabled={currentIndex === 0}
                        className={`absolute left-6 top-1/2 -translate-y-1/2 z-40 p-4 rounded-full bg-black/50 border border-white/20 transition-all ${currentIndex === 0 ? 'opacity-20 cursor-not-allowed' : 'hover:bg-white hover:text-black hover:scale-110'}`}
                    >
                        <Icons.ChevronLeft />
                    </button>
                    <button 
                        onClick={next}
                        disabled={currentIndex === flowGames.length - 1}
                        className={`absolute right-6 top-1/2 -translate-y-1/2 z-40 p-4 rounded-full bg-black/50 border border-white/20 transition-all ${currentIndex === flowGames.length - 1 ? 'opacity-20 cursor-not-allowed' : 'hover:bg-white hover:text-black hover:scale-110'}`}
                    >
                        <Icons.ChevronRight />
                    </button>

                    {/* 3D Flow Track */}
                    <div className="coverflow-viewport flex-grow">
                        <div className="coverflow-track">
                            {flowGames.map((game, idx) => {
                                const offset = idx - currentIndex;
                                // Virtualize: Render only items within a -5 to +5 window for PS4 performance
                                if (Math.abs(offset) > 5) return null;

                                let transform = '';
                                let zIndex = 50 - Math.abs(offset);
                                let opacity = 1;
                                let filter = 'brightness(100%)';

                                if (offset === 0) {
                                    transform = 'translateX(0px) translateZ(160px) rotateY(0deg)';
                                } else if (offset > 0) {
                                    transform = `translateX(${offset * 120 + 80}px) translateZ(0px) rotateY(-55deg)`;
                                    opacity = Math.max(0.2, 1 - offset * 0.18);
                                    filter = 'brightness(60%)';
                                } else {
                                    transform = `translateX(${offset * 120 - 80}px) translateZ(0px) rotateY(55deg)`;
                                    opacity = Math.max(0.2, 1 - Math.abs(offset) * 0.18);
                                    filter = 'brightness(60%)';
                                }

                                const cachedArt = artworkCache[game.id] || game.imageUrl;

                                return (
                                    <div 
                                        key={game.id}
                                        onClick={() => {
                                            if (offset === 0) onGameClick(game, cachedArt);
                                            else setCurrentIndex(idx);
                                        }}
                                        style={{ transform, zIndex, opacity, filter }}
                                        className="coverflow-item bg-black/70 border border-white/30 rounded overflow-hidden shadow-2xl"
                                    >
                                        {cachedArt ? (
                                            <img src={cachedArt} alt={game.title} className="w-full h-full object-cover" />
                                        ) : (
                                            <div className="w-full h-full card-image-fallback flex flex-col items-center justify-center p-4 text-center">
                                                <span className="text-sm font-bold text-white/90 drop-shadow-md">{game.title}</span>
                                            </div>
                                        )}
                                        <img src={PS4_CASE_OVERLAY_URL} className="absolute top-0 left-0 w-full h-full pointer-events-none z-10" style={{ objectFit: 'fill' }} alt="" />
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Active Game Meta */}
                    {activeGame && (
                        <div className="relative z-30 flex flex-col items-center text-center gap-2 max-w-xl px-4 animate-fade-in">
                            <h2 className="text-3xl font-light text-white tracking-wide truncate w-full">{activeGame.title}</h2>
                            <div className="flex items-center gap-3 text-sm text-white/70">
                                <span className="px-2 py-0.5 bg-black/40 border border-white/20 rounded font-mono">{activeGame.region}</span>
                                <span>{formatBytes(activeGame.size)}</span>
                                {activeGame.cusa && <span className="font-mono text-xs">{activeGame.cusa}</span>}
                            </div>
                            <button 
                                onClick={() => onGameClick(activeGame, artworkCache[activeGame.id] || activeGame.imageUrl)}
                                className="mt-3 px-6 py-2 bg-white text-black font-semibold text-sm rounded-full hover:scale-105 transition-transform"
                            >
                                View Details & Download
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        /* =========================================================================
           DASHBOARD ROW & DASHBOARD
           ========================================================================= */
        const DashboardRow = ({ title, items, onGameClick, toggleFav, favourites, emptyMessage }) => {
            const scrollRef = useRef(null);

            const scroll = (direction) => {
                if (scrollRef.current) {
                    const scrollAmount = direction === 'left' ? -800 : 800;
                    scrollRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                }
            };

            if (!items || items.length === 0) {
                return (
                    <div className="mb-12 w-full px-10 animate-fade-in">
                        <h3 className="text-2xl font-light mb-4 text-white/90 tracking-wider flex items-center gap-3">
                            {title}
                        </h3>
                        <div className="bg-black/20 border border-white/10 rounded p-8 text-center text-white/50">
                            {emptyMessage}
                        </div>
                    </div>
                );
            }

            return (
                <div className="mb-12 w-full relative group animate-fade-in">
                    <div className="px-10 flex items-end justify-between mb-4">
                        <h3 className="text-2xl font-light text-white/90 tracking-wider">{title}</h3>
                        <div className="text-sm text-white/50 font-mono">{items.length} item{items.length !== 1 ? 's' : ''}</div>
                    </div>
                    
                    <button onClick={() => scroll('left')} className="absolute left-2 top-1/2 -translate-y-1/2 z-40 bg-black/60 hover:bg-white text-white hover:text-black border border-white/20 p-2 rounded-full opacity-0 group-hover:opacity-100 transition-all hidden md:block">
                        <Icons.ChevronLeft />
                    </button>
                    
                    <button onClick={() => scroll('right')} className="absolute right-2 top-1/2 -translate-y-1/2 z-40 bg-black/60 hover:bg-white text-white hover:text-black border border-white/20 p-2 rounded-full opacity-0 group-hover:opacity-100 transition-all hidden md:block">
                        <Icons.ChevronRight />
                    </button>

                    <div ref={scrollRef} className="dashboard-row-container flex gap-4 overflow-x-auto px-10 pb-6 pt-2 snap-x">
                        {items.map(game => (
                            <div key={game.id} className="snap-start shrink-0">
                                <GameCard 
                                    game={game} 
                                    onClick={onGameClick}
                                    isFav={favourites.includes(game.id)}
                                    toggleFav={toggleFav}
                                />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Dashboard = ({ games, downloadHistory, favourites, recentlyViewed, onGameClick, toggleFav }) => {
            const recentGames = useMemo(() => recentlyViewed.map(id => games.find(g => g.id === id)).filter(Boolean), [recentlyViewed, games]);
            const favGames = useMemo(() => favourites.map(id => games.find(g => g.id === id)).filter(Boolean), [favourites, games]);
            const dlGames = useMemo(() => downloadHistory.map(id => games.find(g => g.id === id)).filter(Boolean), [downloadHistory, games]);

            const heroGame = recentGames[0];
            const [heroImgSrc, setHeroImgSrc] = useState(null);

            useEffect(() => {
                if (!heroGame) return;
                if (artworkCache[heroGame.id]) {
                    setHeroImgSrc(artworkCache[heroGame.id]);
                } else if (heroGame.imageUrl) {
                    setHeroImgSrc(heroGame.imageUrl);
                }

                const pollCache = setInterval(() => {
                    if (artworkCache[heroGame.id] && artworkCache[heroGame.id] !== heroImgSrc) {
                        setHeroImgSrc(artworkCache[heroGame.id]);
                        clearInterval(pollCache);
                    }
                }, 300);

                return () => clearInterval(pollCache);
            }, [heroGame, heroImgSrc]);

            return (
                <div className="flex-grow flex flex-col w-full relative z-10 mt-2 overflow-y-auto custom-scrollbar">
                    {heroGame && (
                        <div className="w-full px-10 mb-10 mt-4">
                            <div className="relative w-full h-[320px] rounded-lg overflow-hidden border border-white/20 shadow-2xl flex items-end p-8 cursor-pointer group" onClick={() => onGameClick(heroGame, heroImgSrc)}>
                                {heroImgSrc ? (
                                    <img src={heroImgSrc} className="absolute inset-0 w-full h-full object-cover opacity-40 group-hover:opacity-60 transition-opacity duration-500" alt="" />
                                ) : (
                                    <div className="absolute inset-0 w-full h-full card-image-fallback opacity-40 group-hover:opacity-60 transition-opacity duration-500" />
                                )}
                                <div className="absolute inset-0 bg-gradient-to-t from-[#001433] via-[#001433]/70 to-transparent"></div>
                                
                                <div className="relative z-10 flex items-center gap-8 w-full">
                                    <div className="w-32 h-44 flex-shrink-0 bg-black/50 border-2 border-white/20 shadow-xl overflow-hidden relative transition-transform group-hover:scale-105">
                                        {heroImgSrc ? (
                                            <img src={heroImgSrc} className="w-full h-full object-cover" alt="" />
                                        ) : (
                                            <div className="w-full h-full card-image-fallback flex items-center justify-center p-2 text-center text-xs font-bold drop-shadow-md">
                                                {heroGame.title}
                                            </div>
                                        )}
                                        <img src={PS4_CASE_OVERLAY_URL} className="absolute top-0 left-0 w-full h-full pointer-events-none z-10" style={{ objectFit: 'fill' }} alt="" />
                                    </div>
                                    <div className="flex flex-col gap-2 drop-shadow-lg">
                                        <span className="text-white/60 text-xs font-semibold tracking-widest uppercase">Resume Browsing</span>
                                        <h2 className="text-4xl md:text-5xl font-light text-white truncate max-w-3xl">{heroGame.title}</h2>
                                        <div className="flex gap-3 mt-1">
                                            <span className="px-2 py-0.5 bg-black/60 border border-white/20 text-xs font-semibold rounded">{heroGame.region}</span>
                                            <span className="px-2 py-0.5 bg-black/60 border border-white/20 text-xs font-semibold rounded">{formatBytes(heroGame.size)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="pb-16 pt-2">
                        <DashboardRow 
                            title="Recently Viewed" 
                            items={recentGames} 
                            onGameClick={onGameClick} 
                            toggleFav={toggleFav} 
                            favourites={favourites}
                            emptyMessage="Games you inspect will appear here for quick access."
                        />
                        <DashboardRow 
                            title="Favourites" 
                            items={favGames} 
                            onGameClick={onGameClick} 
                            toggleFav={toggleFav} 
                            favourites={favourites}
                            emptyMessage="Click the heart icon on any game to pin it to your favourites."
                        />
                        <DashboardRow 
                            title="Downloaded Games" 
                            items={dlGames} 
                            onGameClick={onGameClick} 
                            toggleFav={toggleFav} 
                            favourites={favourites}
                            emptyMessage="Your download history is currently empty."
                        />
                    </div>
                </div>
            );
        };

        /* =========================================================================
           GAME CARD (Comprehensive Scrapers Preserved)
           ========================================================================= */
        const GameCard = React.memo(({ game, onClick, isFav, toggleFav }) => {
            const cardRef = useRef();
            const [isVisible, setIsVisible] = useState(false);
            const [imgState, setImgState] = useState('pending');
            const [currentSrc, setCurrentSrc] = useState(null);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setIsVisible(true); observer.disconnect(); }
                }, { threshold: 0.05, rootMargin: '350px' });
                if (cardRef.current) observer.observe(cardRef.current);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                if (!isVisible || imgState === 'loaded') return;
                let isMounted = true;
                
                const fetchArtwork = async () => {
                    setImgState('loading');
                    
                    // 1. Direct Local Cache Check
                    if (artworkCache[game.id]) { 
                        if (isMounted) { setCurrentSrc(artworkCache[game.id]); setImgState('loaded'); } 
                        return; 
                    }

                    // 2. Direct JSON Image URL Check
                    if (game.imageUrl) { 
                        const validUrl = await checkImage(game.imageUrl);
                        if (validUrl && isMounted) { 
                            saveArtworkCache(game.id, validUrl); 
                            setCurrentSrc(validUrl); 
                            setImgState('loaded'); 
                            return; 
                        } 
                    }

                    // 3. Wikipedia Box Art Search
                    const safeTitle = game.cleanTitle.replace(/[^a-zA-Z0-9 ]/g, ' ').trim();
                    try {
                        const wikiCatUrl = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=intitle:"${encodeURIComponent(safeTitle)}" incategory:"PlayStation 4 game covers"&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&format=json&origin=*`;
                        const resCat = await fetch(wikiCatUrl);
                        const dataCat = await resCat.json();
                        if (dataCat?.query?.pages) {
                            const url = dataCat.query.pages[Object.keys(dataCat.query.pages)[0]]?.imageinfo?.[0]?.url;
                            if (url && isMounted) { saveArtworkCache(game.id, url); setCurrentSrc(url); setImgState('loaded'); return; }
                        }
                    } catch (e) {}

                    // 4. Steam Grid Box Art via CheapShark
                    const shortTitle = game.cleanTitle.split(' ').slice(0, 4).join(' ');
                    try {
                        const csRes = await fetch(`https://www.cheapshark.com/api/1.0/games?title=${encodeURIComponent(shortTitle)}&limit=1`);
                        const csData = await csRes.json();
                        if (csData?.[0]?.thumb) {
                            const steamAppMatch = csData[0].thumb.match(/apps\/(\d+)\//);
                            if (steamAppMatch) {
                                const finalUrl = await checkImage(`https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${steamAppMatch[1]}/library_600x900.jpg`);
                                if (finalUrl && isMounted) { saveArtworkCache(game.id, finalUrl); setCurrentSrc(finalUrl); setImgState('loaded'); return; }
                            }
                        }
                    } catch (e) {}

                    if (isMounted) setImgState('error');
                };
                
                fetchArtwork();
                return () => { isMounted = false; };
            }, [isVisible, game]);

            return (
                <div className="flex flex-col gap-2 relative group w-[170px] sm:w-auto">
                    <div 
                        ref={cardRef}
                        className="ps4-tile w-full aspect-[3/4] relative overflow-hidden flex-shrink-0 rounded-sm"
                        tabIndex="0"
                        onKeyDown={(e) => { if (e.key === 'Enter') onClick(game, currentSrc); }}
                    >
                        <div className="absolute inset-0 z-20" onClick={() => onClick(game, currentSrc)}></div>
                        
                        <button 
                            onClick={(e) => { e.stopPropagation(); toggleFav(game.id); }}
                            className="absolute top-2 left-2 z-30 p-1.5 rounded-full bg-black/40 border border-white/20 hover:bg-black/60 transition-colors drop-shadow-lg focus:outline-none"
                            title={isFav ? "Remove Favourite" : "Add Favourite"}
                        >
                            <Icons.Heart filled={isFav} />
                        </button>

                        {imgState === 'loaded' && currentSrc ? (
                            <img src={currentSrc} alt={game.title} className="w-full h-full object-cover animate-fade-in" loading="lazy" />
                        ) : (
                            <div className="w-full h-full card-image-fallback flex flex-col items-center justify-center p-4 pt-10 text-center">
                                {imgState === 'error' ? <span className="font-bold text-white/90 text-xs shadow-sm">{game.title}</span> : <div className="w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>}
                            </div>
                        )}
                        
                        <img src={PS4_CASE_OVERLAY_URL} className="absolute top-0 left-0 w-full h-full pointer-events-none z-10" style={{ objectFit: 'fill' }} alt="" />

                        <div className="absolute top-7 right-2 flex flex-col gap-1 items-end z-10 pointer-events-none">
                            {game.isBroken && <span className="text-white text-[9px] font-bold px-1 py-0.5 rounded-sm shadow-md mb-0.5 broken-strip border border-red-500/50">BROKEN</span>}
                            {game.region !== 'Other' && <span className="bg-red-700 text-white text-[9px] font-bold px-1 py-0.5 rounded-sm shadow-md">{game.region}</span>}
                            {game.type !== 'Base Game' && <span className="bg-[#0040a8] text-white text-[9px] font-bold px-1 py-0.5 rounded-sm shadow-md">{game.type}</span>}
                        </div>

                        <div className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/90 to-transparent px-2 py-1 pt-4 z-10 pointer-events-none">
                            <p className="text-[10px] text-white/80 font-mono text-right">{formatBytes(game.size)}</p>
                        </div>
                    </div>
                    <div className="w-full px-1 opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity duration-200 text-center">
                        <p className="text-white text-xs font-semibold truncate drop-shadow-md">{game.title}</p>
                    </div>
                </div>
            );
        });

        function useInfiniteScroll(callback, hasMore) {
            const observer = useRef(null);
            const observerTarget = useCallback((node) => {
                if (observer.current) observer.current.disconnect();
                if (!node || !hasMore) return;
                
                observer.current = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) {
                        callback();
                    }
                }, { root: null, rootMargin: '300px', threshold: 0.1 });
                
                observer.current.observe(node);
            }, [callback, hasMore]);
            return observerTarget;
        }

        const Clock = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            return <div className="text-white font-medium text-sm md:text-base tracking-wide">{time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>;
        };

        /* =========================================================================
           ROOT APPLICATION
           ========================================================================= */
        const App = () => {
            const [games, setGames] = useState([]);
            const [fetchStatus, setFetchStatus] = useState({ active: true, currentLetter: 'Loading Local Data...' });
            const [selectedGame, setSelectedGame] = useState(null);
            
            const [isQueueOpen, setIsQueueOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [showDisclaimer, setShowDisclaimer] = useState(() => !getCache('ps4_disclaimer_accepted', false));
            
            // Persisted States
            const [settings, setSettings] = useState(() => getCache('ps4_settings', { hideDownloaded: false, showBrokenLinks: false, defaultView: 'store' }));
            const [downloadHistory, setDownloadHistory] = useState(() => getCache('ps4_downloaded_games', []));
            const [queue, setQueue] = useState(() => getCache('ps4_download_queue', []));
            const [favourites, setFavourites] = useState(() => getCache('ps4_favourites', []));
            const [recentlyViewed, setRecentlyViewed] = useState(() => getCache('ps4_recent', []));
            
            // Set Store default dynamically from settings on load
            const [currentView, setCurrentView] = useState(() => settings.defaultView || 'store');

            useEffect(() => saveCache('ps4_settings', settings), [settings]);
            useEffect(() => saveCache('ps4_download_queue', queue), [queue]);
            useEffect(() => saveCache('ps4_favourites', favourites), [favourites]);
            useEffect(() => saveCache('ps4_recent', recentlyViewed), [recentlyViewed]);

            const acceptDisclaimer = () => {
                saveCache('ps4_disclaimer_accepted', true);
                setShowDisclaimer(false);
            };

            // Handlers
            const handleGameClick = useCallback((g, src) => {
                setSelectedGame({ game: g, coverSrc: src });
                setRecentlyViewed(prev => {
                    const filtered = prev.filter(id => id !== g.id);
                    const updated = [g.id, ...filtered].slice(0, 30);
                    saveCache('ps4_recent', updated);
                    return updated;
                });
            }, []);

            const toggleFav = useCallback((id) => {
                setFavourites(prev => {
                    const isFaved = prev.includes(id);
                    const updated = isFaved ? prev.filter(f => f !== id) : [id, ...prev];
                    saveCache('ps4_favourites', updated);
                    return updated;
                });
            }, []);

            const handleAddToQueue = useCallback((game, coverSrc) => {
                setQueue(prev => prev.find(q => q.id === game.id) ? prev : [...prev, { id: game.id, game, coverSrc }]);
            }, []);

            const markAsDownloaded = useCallback((id) => {
                setDownloadHistory(prev => {
                    if (prev.includes(id)) return prev;
                    const updated = [id, ...prev];
                    saveCache('ps4_downloaded_games', updated);
                    return updated;
                });
            }, []);

            const clearAllCache = () => {
                localStorage.clear();
                window.location.reload(); 
            };

            // Filters & Sorts
            const [activeCategory, setActiveCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [searchInput, setSearchInput] = useState('');
            const [regionFilter, setRegionFilter] = useState('All');
            const [dlStatusFilter, setDlStatusFilter] = useState('All');
            const [artworkOnly, setArtworkOnly] = useState(false);
            const [sortOption, setSortOption] = useState('A-Z');
            const [minSizeGB, setMinSizeGB] = useState('');
            const [maxSizeGB, setMaxSizeGB] = useState('');
            const [displayLimit, setDisplayLimit] = useState(48);

            // Debounced Search Input
            useEffect(() => {
                const handler = setTimeout(() => setSearchQuery(searchInput), 200);
                return () => clearTimeout(handler);
            }, [searchInput]);

            useEffect(() => {
                let isMounted = true;
                const fetchLocalData = async () => {
                    try {
                        const formatGame = (game, isBroken) => {
                            const extMatch = game.original_filename.match(/\.([a-z0-9]+)$/i);
                            return {
                                id: game.original_filename,
                                title: game.clean_title,
                                cleanTitle: game.clean_title,
                                originalFilename: game.original_filename,
                                collection: game.collection,
                                size: Math.floor((game.size_gb || 0) * 1024 * 1024 * 1024), 
                                sizeGB: game.size_gb,
                                format: extMatch ? extMatch[1].toUpperCase() : 'PKG',
                                cusa: game.cusa,
                                region: game.region,
                                type: game.type,
                                downloadUrl: game.download_link,
                                sourceUrl: `https://archive.org/details/${game.collection}`,
                                imageUrl: game.artwork_url || null,
                                overview: game.overview || null,
                                isBroken
                            };
                        };

                        const [workRes, errRes] = await Promise.all([
                            fetch('./working_games.json').catch(() => null),
                            fetch('./error_games.json').catch(() => null)
                        ]);

                        let allGames = [];
                        if (workRes?.ok) allGames = allGames.concat((await workRes.json()).map(g => formatGame(g, false)));
                        if (errRes?.ok) allGames = allGames.concat((await errRes.json()).map(g => formatGame(g, true)));
                        
                        if (isMounted) {
                            setGames(allGames);
                            setFetchStatus({ active: false, currentLetter: allGames.length === 0 ? 'No games found.' : '' });
                        }
                    } catch (e) {
                        if (isMounted) setFetchStatus({ active: false, currentLetter: 'Error loading index' });
                    }
                };
                fetchLocalData();
                return () => { isMounted = false; };
            }, []);

            const processedGames = useMemo(() => {
                let result = [...games];

                // Settings Filters
                if (!settings.showBrokenLinks) result = result.filter(g => !g.isBroken);
                if (settings.hideDownloaded) result = result.filter(g => !downloadHistory.includes(g.id));

                // Artwork Only Toggle
                if (artworkOnly) {
                    result = result.filter(g => artworkCache[g.id] || g.imageUrl);
                }

                // Advanced Broad Search
                if (searchQuery) {
                    const q = searchQuery.toLowerCase().trim();
                    result = result.filter(g => 
                        g.title.toLowerCase().includes(q) || 
                        (g.cusa && g.cusa.toLowerCase().includes(q)) ||
                        (g.originalFilename && g.originalFilename.toLowerCase().includes(q)) ||
                        g.region.toLowerCase().includes(q) ||
                        g.type.toLowerCase().includes(q) ||
                        (g.collection && g.collection.toLowerCase().includes(q))
                    );
                }
                
                // Category Navigation
                if (activeCategory === 'Favourites') result = result.filter(g => favourites.includes(g.id));
                else if (activeCategory !== 'All') {
                    const typeMap = { 'Games': 'Base Game', 'Updates': 'Update', 'Add-Ons': 'DLC' };
                    result = result.filter(g => g.type === typeMap[activeCategory]);
                }
                
                // Sub-Filters
                if (regionFilter !== 'All') result = result.filter(g => g.region === regionFilter);
                if (dlStatusFilter === 'Downloaded') result = result.filter(g => downloadHistory.includes(g.id));
                if (dlStatusFilter === 'Not Downloaded') result = result.filter(g => !downloadHistory.includes(g.id));

                if (minSizeGB !== '') {
                    const min = parseFloat(minSizeGB);
                    if (!isNaN(min)) result = result.filter(g => g.sizeGB >= min);
                }
                if (maxSizeGB !== '') {
                    const max = parseFloat(maxSizeGB);
                    if (!isNaN(max)) result = result.filter(g => g.sizeGB <= max);
                }

                // Sorting
                result.sort((a, b) => {
                    switch(sortOption) {
                        case 'Z-A': return b.title.localeCompare(a.title);
                        case 'Size (Small-Large)': return a.size - b.size;
                        case 'Size (Large-Small)': return b.size - a.size;
                        case 'Downloaded First': 
                            const aDl = downloadHistory.includes(a.id);
                            const bDl = downloadHistory.includes(b.id);
                            if (aDl === bDl) return a.title.localeCompare(b.title);
                            return aDl ? -1 : 1;
                        case 'Not Downloaded First':
                            const aNd = !downloadHistory.includes(a.id);
                            const bNd = !downloadHistory.includes(b.id);
                            if (aNd === bNd) return a.title.localeCompare(b.title);
                            return aNd ? -1 : 1;
                        case 'A-Z':
                        default: return a.title.localeCompare(b.title);
                    }
                });
                return result;
            }, [games, searchQuery, activeCategory, regionFilter, dlStatusFilter, artworkOnly, sortOption, minSizeGB, maxSizeGB, settings, downloadHistory, favourites]);

            // Reset pagination on filter adjustments
            useEffect(() => { setDisplayLimit(48); }, [searchQuery, activeCategory, regionFilter, dlStatusFilter, artworkOnly, sortOption, minSizeGB, maxSizeGB]);

            const displayedGames = useMemo(() => processedGames.slice(0, displayLimit), [processedGames, displayLimit]);
            const hasMore = displayLimit < processedGames.length;
            const loadMore = useCallback(() => setDisplayLimit(prev => prev + 48), []);
            const loaderRef = useInfiniteScroll(loadMore, hasMore);

            return (
                <div className="h-screen flex flex-col relative text-white">
                    <DisclaimerModal 
                        isOpen={showDisclaimer} 
                        onAccept={acceptDisclaimer} 
                    />

                    <SettingsModal 
                        isOpen={isSettingsOpen} 
                        onClose={() => setIsSettingsOpen(false)}
                        settings={settings}
                        setSettings={setSettings}
                        clearCache={clearAllCache}
                    />

                    {selectedGame && (
                        <GameDetailsModal 
                            game={selectedGame.game} 
                            coverSrc={selectedGame.coverSrc}
                            onClose={() => setSelectedGame(null)} 
                            queue={queue}
                            addToQueue={handleAddToQueue}
                            markAsDownloaded={markAsDownloaded}
                            isFav={favourites.includes(selectedGame.game.id)}
                            toggleFav={toggleFav}
                        />
                    )}

                    <QueueManager 
                        isOpen={isQueueOpen} 
                        onClose={() => setIsQueueOpen(false)} 
                        queue={queue}
                        setQueue={setQueue}
                        markAsDownloaded={markAsDownloaded}
                    />

                    {/* PS4 Library Top Bar */}
                    <header className="w-full flex-shrink-0 pt-4 pb-3 px-6 md:px-10 flex flex-wrap justify-between items-center z-10 bg-gradient-to-b from-black/50 to-transparent gap-4">
                        <div className="flex items-center gap-3 text-2xl md:text-3xl font-light tracking-wide">
                            <Icons.Library /> 
                            <span>Library</span>
                        </div>

                        <div className="flex items-center flex-wrap gap-3 md:gap-5">
                            {fetchStatus.active && (
                                <div className="text-xs md:text-sm text-white/80 flex items-center gap-2 bg-black/20 px-3 py-1 rounded-full border border-white/10">
                                    <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                                    {fetchStatus.currentLetter}
                                </div>
                            )}

                            {/* View Switchers */}
                            <div className="flex bg-black/40 p-1 rounded-full border border-white/10">
                                <button 
                                    onClick={() => setCurrentView('dashboard')}
                                    className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold transition-all ${currentView === 'dashboard' ? 'bg-white text-black' : 'text-white/70 hover:text-white'}`}
                                >
                                    <Icons.Dashboard /> Dashboard
                                </button>
                                
                                <button 
                                    onClick={() => setCurrentView('store')}
                                    className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold transition-all ${currentView === 'store' ? 'bg-white text-black' : 'text-white/70 hover:text-white'}`}
                                >
                                    <Icons.Search /> Store
                                </button>

                                <button 
                                    onClick={() => setCurrentView('coverflow')}
                                    className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold transition-all ${currentView === 'coverflow' ? 'bg-white text-black' : 'text-white/70 hover:text-white'}`}
                                >
                                    <Icons.CoverFlow /> Cover Flow
                                </button>
                            </div>

                            <button 
                                onClick={() => setIsQueueOpen(true)}
                                className="flex items-center gap-2 bg-white/10 hover:bg-white/20 transition-colors px-3 py-1.5 rounded-full border border-white/20 focus:outline-none text-xs font-semibold"
                            >
                                <Icons.Queue />
                                <span>Queue ({queue.length})</span>
                            </button>

                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className="flex items-center gap-2 bg-white/10 hover:bg-white/20 transition-colors p-2 rounded-full border border-white/20 focus:outline-none"
                                title="Settings"
                            >
                                <Icons.Settings />
                            </button>

                            <div className="hidden sm:flex items-center gap-2 bg-black/20 px-3 py-1 rounded-full border border-white/10">
                                <div className="w-5 h-5 rounded bg-blue-600 flex items-center justify-center text-xs"><Icons.User /></div>
                                <span className="font-semibold text-xs px-1">Player 1</span>
                            </div>
                            <Clock />
                        </div>
                    </header>

                    {/* View Router */}
                    {currentView === 'dashboard' && (
                        <Dashboard 
                            games={games} 
                            downloadHistory={downloadHistory} 
                            favourites={favourites} 
                            recentlyViewed={recentlyViewed}
                            onGameClick={handleGameClick}
                            toggleFav={toggleFav}
                        />
                    )}

                    {currentView === 'coverflow' && (
                        <CoverFlowGallery 
                            games={processedGames}
                            onGameClick={handleGameClick}
                            favourites={favourites}
                            toggleFav={toggleFav}
                        />
                    )}

                    {currentView === 'store' && (
                        <div className="flex-grow flex overflow-hidden w-full relative z-10 mt-2 animate-fade-in">
                            {/* Filter Sidebar */}
                            <aside className="w-64 md:w-72 flex-shrink-0 flex flex-col gap-5 px-6 pb-8 overflow-y-auto custom-scrollbar border-r border-white/10">
                                <nav className="flex flex-col gap-1">
                                    {['All', 'Favourites', 'Games', 'Updates', 'Add-Ons'].map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => setActiveCategory(cat)}
                                            className={`ps4-nav-item flex items-center justify-between text-left py-2.5 px-4 text-base rounded cursor-pointer ${activeCategory === cat ? 'selected' : 'text-white/70'}`}
                                        >
                                            {cat}
                                            {cat === 'Favourites' && <Icons.Heart filled={activeCategory === 'Favourites'} />}
                                        </button>
                                    ))}
                                </nav>

                                <div className="w-full h-px bg-white/20"></div>

                                <div className="flex flex-col gap-4">
                                    <div className="text-xs font-semibold tracking-widest uppercase text-white/50 px-1">Filter Library</div>
                                    
                                    <div className="relative">
                                        <Icons.Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-white/50" />
                                        <input 
                                            type="text" 
                                            placeholder="Title, CUSA, File..."
                                            className="ps4-input pl-9 pr-3 py-1.5 w-full text-xs rounded-full"
                                            value={searchInput}
                                            onChange={(e) => setSearchInput(e.target.value)}
                                        />
                                    </div>

                                    {/* Artwork Toggle */}
                                    <label className="flex items-center gap-3 cursor-pointer p-2 bg-black/20 hover:bg-white/5 rounded border border-white/10">
                                        <input 
                                            type="checkbox" 
                                            checked={artworkOnly} 
                                            onChange={e => setArtworkOnly(e.target.checked)} 
                                            className="w-4 h-4 accent-blue-600 rounded bg-black/50 border-white/30"
                                        />
                                        <span className="text-xs text-white/80 font-medium">Artwork only</span>
                                    </label>

                                    <div className="flex flex-col gap-1.5">
                                        <label className="text-white/70 text-xs font-semibold px-1">Sort By</label>
                                        <select 
                                            className="ps4-select w-full px-2.5 py-1.5 text-xs rounded"
                                            value={sortOption}
                                            onChange={e => setSortOption(e.target.value)}
                                        >
                                            <option>A-Z</option>
                                            <option>Z-A</option>
                                            <option>Size (Small-Large)</option>
                                            <option>Size (Large-Small)</option>
                                            <option>Downloaded First</option>
                                            <option>Not Downloaded First</option>
                                        </select>
                                    </div>

                                    <div className="flex flex-col gap-1.5">
                                        <label className="text-white/70 text-xs font-semibold px-1">Status</label>
                                        <div className="flex gap-1.5 bg-black/30 p-1 rounded">
                                            {['All', 'Downloaded', 'Not Downloaded'].map(stat => (
                                                <button 
                                                    key={stat} onClick={() => setDlStatusFilter(stat)}
                                                    className={`flex-1 py-1 text-[11px] text-center rounded transition-colors ${dlStatusFilter === stat ? 'bg-white text-black font-bold' : 'text-white/70 hover:bg-white/10'}`}
                                                >
                                                    {stat === 'Not Downloaded' ? 'New' : stat}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-1.5">
                                        <label className="text-white/70 text-xs font-semibold px-1">Region Tag</label>
                                        <div className="flex gap-1.5 bg-black/30 p-1 rounded">
                                            {['All', 'US', 'EU'].map(reg => (
                                                <button 
                                                    key={reg} onClick={() => setRegionFilter(reg)}
                                                    className={`flex-1 py-1 text-[11px] rounded transition-colors ${regionFilter === reg ? 'bg-white text-black font-bold' : 'text-white/70 hover:bg-white/10'}`}
                                                >
                                                    {reg}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-1.5">
                                        <label className="text-white/70 text-xs font-semibold px-1">Size Limits (GB)</label>
                                        <div className="flex items-center gap-2">
                                            <input 
                                                type="number" 
                                                placeholder="Min" 
                                                className="ps4-input w-full px-2 py-1 text-xs text-center"
                                                value={minSizeGB}
                                                onChange={(e) => setMinSizeGB(e.target.value)}
                                            />
                                            <span className="text-white/50 text-xs">-</span>
                                            <input 
                                                type="number" 
                                                placeholder="Max" 
                                                className="ps4-input w-full px-2 py-1 text-xs text-center"
                                                value={maxSizeGB}
                                                onChange={(e) => setMaxSizeGB(e.target.value)}
                                            />
                                        </div>
                                    </div>

                                    <div className="mt-2 px-1">
                                        <p className="text-white/40 text-[11px] font-mono">{processedGames.length} games available</p>
                                    </div>
                                </div>
                            </aside>

                            {/* Grid Display */}
                            <main className="flex-grow px-6 md:px-8 pb-16 overflow-y-auto custom-scrollbar">
                                {displayedGames.length === 0 && !fetchStatus.active ? (
                                    <div className="w-full h-full flex flex-col items-center justify-center text-white/30">
                                        <Icons.Search />
                                        <h2 className="text-lg mt-3">No matching packages found</h2>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 gap-4 pr-2">
                                        {displayedGames.map((game, idx) => (
                                            <div key={`${game.id}-${idx}`} className="animate-slide-in" style={{ animationDelay: `${(idx % 24) * 0.02}s` }}>
                                                <GameCard 
                                                    game={game} 
                                                    onClick={handleGameClick}
                                                    isFav={favourites.includes(game.id)}
                                                    toggleFav={toggleFav}
                                                />
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div ref={loaderRef} className="w-full py-10 flex justify-center text-white/40">
                                    {hasMore ? (
                                        <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                                    ) : displayedGames.length > 0 && (
                                        <span className="text-xs font-bold tracking-widest uppercase opacity-30">End of Library</span>
                                    )}
                                </div>
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
